[package]
name = "lazyaicode-web"
description = "LazyAICode no navegador: o mesmo motor de UI (egui) compilado para WebAssembly, ligado a um `lazyaicode-cli serve` por WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lazyaicode-ui-egui.workspace = true
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlCanvasElement", "Storage", "Element"] }
rfd.workspace = true
base64.workspace = true

[lints]
workspace = true
