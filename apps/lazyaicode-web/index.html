<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LazyAICode</title>
  <link data-trunk rel="rust" data-cargo-profile="wasm-release" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" data-bin="lazyaicode-web" />
  <link data-trunk rel="icon" href="../../assets/icons/32x32.png" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16171b; }
    @media (prefers-color-scheme: light) { html, body { background: #fbfbfc; } }
    canvas { width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 14px system-ui, sans-serif; color: #8b919c; }
  </style>
</head>
<body>
  <canvas id="lazyaicode"></canvas>
  <div id="loading">Carregando o LazyAICode…</div>
</body>
</html>
