# Flatpak do LazyAICode, compilado do código-fonte com o SDK de Rust.
#   flatpak-builder --user --install --force-clean build packaging/linux/flatpak/ai.lazyaicode.LazyAICode.yml
# O agente (claude/codex/gemini) e o git vêm do sistema: --talk-name e a
# permissão de host abaixo deixam o app rodá-los fora da sandbox via flatpak-spawn.
app-id: ai.lazyaicode.LazyAICode
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lazyaicode
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lazyaicode/cargo
  build-args:
    - --share=network
modules:
  - name: lazyaicode
    buildsystem: simple
    build-commands:
      - cargo build --release -p lazyaicode -p lazyaicode-cli
      - install -Dm755 target/release/lazyaicode /app/bin/lazyaicode
      - install -Dm755 target/release/lazyaicode-cli /app/bin/lazyaicode-cli
      - install -Dm644 packaging/linux/lazyaicode.desktop /app/share/applications/ai.lazyaicode.LazyAICode.desktop
      - sed -i 's/^Icon=.*/Icon=ai.lazyaicode.LazyAICode/' /app/share/applications/ai.lazyaicode.LazyAICode.desktop
      - install -Dm644 assets/icons/128x128.png /app/share/icons/hicolor/128x128/apps/ai.lazyaicode.LazyAICode.png
      - install -Dm644 packaging/linux/ai.lazyaicode.LazyAICode.metainfo.xml /app/share/metainfo/ai.lazyaicode.LazyAICode.metainfo.xml
    sources:
      - type: dir
        path: ../../..
