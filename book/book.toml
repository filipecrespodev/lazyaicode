[book]
authors = ["LazyAICode contributors"]
language = "pt-BR"
src = "src"
title = "LazyAICode — documentação"

[build]
build-dir = "output"
create-missing = false

[output.html]
git-repository-url = "https://github.com/filipecrespodev/lazyaicode"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/filipecrespodev/lazyaicode/edit/main/book/{path}"
preferred-dark-theme = "navy"
smart-punctuation = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
