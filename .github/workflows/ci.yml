name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, camadas, traduções, clippy, testes e wasm — o mesmo `cargo xtask ci` de antes de cada commit
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers
      - run: git config --global user.email ci@lazyaicode && git config --global user.name ci
      - run: cargo xtask ci

  fuzz-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: fuzz }
      - run: cargo test --manifest-path fuzz/Cargo.toml --release
        env: { FUZZ_SMOKE_ITERS: "20000" }

  fuzz:
    # libFuzzer de verdade, um minuto por alvo, com AddressSanitizer
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install --locked cargo-fuzz
      - run: |
          for t in $(cargo +nightly fuzz list); do
            mkdir -p fuzz/corpus/$t && cp -n fuzz/seeds/$t/* fuzz/corpus/$t/ 2>/dev/null || true
            cargo +nightly fuzz run $t fuzz/corpus/$t -- -max_total_time=60 -rss_limit_mb=2048 -max_len=65536
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: fuzz-artifacts, path: fuzz/artifacts }

  book:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - run: cargo xtask commands && git diff --exit-code book/src/reference/
      - run: mdbook build book

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: swatinem/rust-cache@v2
      - run: curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - run: cargo xtask web

  # O binário Linux rodando dentro do WSL, como no Windows de quem usa WSLg.
  wsl:
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: build-essential curl git pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: testes dentro do WSL
        run: |
          . "$HOME/.cargo/env"
          rm -rf ~/app && cp -r . ~/app && cd ~/app
          git config --global user.email ci@lazyaicode && git config --global user.name ci
          uname -a && cat /proc/sys/kernel/osrelease
          EXPECT_WSL=1 cargo test -p lazyaicode-platform -p lazyaicode-git -p lazyaicode-engine -p lazyaicode-wsl-agent
