name: release
on:
  push:
    tags: ["v*"]
jobs:
  # O backend git sem interface que o app do Windows roda dentro do WSL
  # (repositórios em \\wsl.localhost\...). glibc do runner mais antigo para
  # rodar em mais distros; libgit2, OpenSSL e libssh2 vão estáticos (vendored).
  agent:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cargo build --release --no-default-features --bin lazyaicode-agent
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: lazyaicode-agent
          path: src-tauri/target/release/lazyaicode-agent
          if-no-files-found: error
  build:
    needs: agent
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-latest, args: "--target x86_64-apple-darwin" }
          # 22.04: glibc mais antiga = AppImage/deb rodam em mais distros (e no Ubuntu do WSL)
          - { os: ubuntu-22.04, args: "" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: lazyaicode-agent
          path: src-tauri/resources
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LazyAICode ${{ github.ref_name }}
          releaseBody: |
            Instaladores abaixo. Linux e WSL: `curl -fsSL https://raw.githubusercontent.com/filipecrespodev/lazyaicode/main/scripts/install.sh | sh`
            O app se atualiza sozinho ao abrir.
          args: ${{ matrix.args }}
